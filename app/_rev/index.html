<!doctype html><meta name=robots content=noindex><style>body{margin:0;background:#111;color:#fff;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}div.c{position:relative}img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}b{position:absolute;left:0;top:0;background:#e0f;padding:1px 4px;font-size:14px}</style><div id=g></div><script>
fetch('list.json').then(r=>r.json()).then(L=>{const p=new URLSearchParams(location.search),s=+p.get('s')||0,n=+p.get('n')||24;document.getElementById('g').innerHTML=L.slice(s,s+n).map(([i,id])=>`<div class=c><img src="https://drive.google.com/thumbnail?id=${id}&sz=w300"><b>${i}</b></div>`).join('')})</script>
